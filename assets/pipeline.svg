  <rect x="30" y="230" width="1010" height="4" rx="2" fill="#1e293b"/><rect x="30" y="230" width="0" height="4" rx="2" fill="#3b82f6"><animate attributeName="width" values="0;1010" dur="6s" repeatCount="indefinite"/></rect>
