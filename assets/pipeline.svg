    <clipPath id="c1"><rect x="0" y="0" width="200" height="130" rx="10"/></clipPath>
  </defs>
  <rect width="1100" height="260" rx="18" fill="#0f172a"/>
  <g font-size="13" fill="#e2e8f0" text-anchor="middle" font-weight="600">
