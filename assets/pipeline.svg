    <rect x="62" y="24" width="76" height="76" fill="none" stroke="#22c55e" stroke-width="3" stroke-dasharray="304" stroke-dashoffset="304"><animate attributeName="stroke-dashoffset" values="304;304;0;0;304" keyTimes="0;.6;.78;.9;1" dur="6s" repeatCount="indefinite"/></rect>
