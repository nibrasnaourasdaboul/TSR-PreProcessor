  <g stroke="#94a3b8" stroke-width="2" marker-end="url(#a2)"><line x1="236" y1="110" x2="292" y2="110"/><line x1="506" y1="110" x2="562" y2="110"/><line x1="776" y1="110" x2="832" y2="110"/></g>
  <g font-size="12" fill="#94a3b8" text-anchor="middle" font-family="Consolas, monospace">
    <text x="130" y="205">cv2.imread / frame</text><text x="400" y="205">createCLAHE(3.0, (8,8))</text>
