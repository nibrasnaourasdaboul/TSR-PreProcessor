    <circle cx="100" cy="62" r="30" fill="#d62424"><animate attributeName="opacity" values=".3;.3;1;1;.3" keyTimes="0;.15;.4;.9;1" dur="6s" repeatCount="indefinite"/></circle><text x="100" y="67" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">STOP</text></g>
  <!-- panel 3 -->
