<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6fd0"><animate attributeName="stop-color" values="#2f6fd0;#0a1020;#0a1020;#2f6fd0" keyTimes="0;.4;.6;1" dur="12s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#bcd9f2"><animate attributeName="stop-color" values="#bcd9f2;#1b2444;#1b2444;#bcd9f2" keyTimes="0;.4;.6;1" dur="12s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3d44"/><stop offset="1" stop-color="#202226"/></linearGradient>
    <radialGradient id="beam" cx="0" cy=".5" r="1"><stop offset="0" stop-color="#fff3c4" stop-opacity=".85"/><stop offset="1" stop-color="#fff3c4" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="1200" height="320" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#fff" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.4;.6;1" dur="12s" repeatCount="indefinite"/>
    <circle cx="120" cy="40" r="1.5"/><circle cx="310" cy="70" r="1.2"/><circle cx="520" cy="30" r="1.6"/><circle cx="760" cy="55" r="1.3"/><circle cx="980" cy="35" r="1.5"/><circle cx="1120" cy="80" r="1.2"/><circle cx="660" cy="85" r="1"/>
  </g>
  <!-- sun / moon -->
  <circle r="26" fill="#ffe9a8"><animate attributeName="cx" values="150;600;1050" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="90;30;90" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;0;1" keyTimes="0;.35;.65;1" dur="12s" repeatCount="indefinite"/></circle>
  <circle r="20" fill="#dfe8ff"><animate attributeName="cx" values="150;600;1050" dur="12s" begin="6s" repeatCount="indefinite"/><animate attributeName="cy" values="90;30;90" dur="12s" begin="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="12s" begin="6s" repeatCount="indefinite"/></circle>
  <!-- skyline -->
  <g fill="#1a2233">
    <rect x="40" y="120" width="70" height="120"/><rect x="120" y="80" width="60" height="160"/><rect x="190" y="140" width="80" height="100"/>
    <rect x="290" y="60" width="64" height="180"/><rect x="365" y="110" width="90" height="130"/><rect x="470" y="90" width="56" height="150"/>
    <rect x="540" y="130" width="100" height="110"/><rect x="655" y="50" width="70" height="190"/><rect x="740" y="100" width="80" height="140"/>
    <rect x="835" y="140" width="60" height="100"/><rect x="910" y="75" width="70" height="165"/><rect x="995" y="120" width="90" height="120"/><rect x="1100" y="95" width="70" height="145"/>
  </g>
  <!-- lit windows (night) -->
  <g fill="#ffd27a" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.4;.6;1" dur="12s" repeatCount="indefinite"/>
    <rect x="135" y="100" width="8" height="10"/><rect x="155" y="130" width="8" height="10"/><rect x="305" y="85" width="8" height="10"/><rect x="330" y="120" width="8" height="10"/>
    <rect x="385" y="135" width="8" height="10"/><rect x="480" y="115" width="8" height="10"/><rect x="670" y="80" width="8" height="10"/><rect x="700" y="130" width="8" height="10"/>
    <rect x="760" y="125" width="8" height="10"/><rect x="925" y="100" width="8" height="10"/><rect x="1010" y="145" width="8" height="10"/><rect x="1120" y="120" width="8" height="10"/>
  </g>
  <!-- road -->
  <rect y="240" width="1200" height="80" fill="url(#road)"/>
  <rect y="236" width="1200" height="6" fill="#8d8f93"/>
  <line x1="0" y1="282" x2="1200" y2="282" stroke="#f1c40f" stroke-width="3" stroke-dasharray="40 30"><animate attributeName="stroke-dashoffset" from="0" to="-70" dur=".6s" repeatCount="indefinite"/></line>
  <!-- stop sign -->
  <g transform="translate(1020,160)">
    <rect x="-2" y="0" width="4" height="82" fill="#9aa0a8"/>
    <polygon points="-18,-8 -8,-18 8,-18 18,-8 18,8 8,18 -8,18 -18,8" fill="#c8101c" stroke="#fff" stroke-width="2" transform="translate(0,0)"/>
    <text y="4" font-size="9" font-weight="800" fill="#fff" text-anchor="middle">STOP</text>
  </g>
  <!-- car -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-260,0;640,0;640,0;-260,0" keyTimes="0;.55;.8;1" dur="12s" repeatCount="indefinite"/>
    <ellipse cx="170" cy="300" rx="90" ry="8" fill="#000" opacity=".35"/>
    <polygon points="250,262 420,262 400,224 330,206 250,222" fill="url(#beam)" opacity="0"><animate attributeName="opacity" values="0;.9;.9;0" keyTimes="0;.4;.6;1" dur="12s" repeatCount="indefinite"/></polygon>
    <path d="M70 288 L70 262 Q72 252 90 250 L120 238 Q140 214 170 212 L225 212 Q245 214 258 238 L282 248 Q292 252 292 268 L292 288 Z" fill="#1e4fd8"/>
    <path d="M128 240 Q146 220 172 220 L222 220 Q238 222 248 240 Z" fill="#0b141d"/>
    <rect x="266" y="256" width="22" height="8" rx="3" fill="#fff6d0"/><rect x="72" y="258" width="14" height="8" rx="3" fill="#ff2a2a"/>
    <g fill="#111"><circle cx="118" cy="290" r="19"/><circle cx="246" cy="290" r="19"/></g>
    <g fill="#c7ccd4"><circle cx="118" cy="290" r="10"/><circle cx="246" cy="290" r="10"/></g>
    <g stroke="#555" stroke-width="2"><line x1="108" y1="290" x2="128" y2="290"><animateTransform attributeName="transform" type="rotate" from="0 118 290" to="360 118 290" dur=".5s" repeatCount="indefinite"/></line><line x1="236" y1="290" x2="256" y2="290"><animateTransform attributeName="transform" type="rotate" from="0 246 290" to="360 246 290" dur=".5s" repeatCount="indefinite"/></line></g>
  </g>
  <!-- title -->
  <text x="600" y="150" font-size="46" font-weight="800" fill="#fff" text-anchor="middle" stroke="#0a1020" stroke-width="1" paint-order="stroke">TSR-PreProcessor</text>
  <text x="600" y="184" font-size="19" fill="#e8f0ff" text-anchor="middle" paint-order="stroke" stroke="#0a1020" stroke-width="3">Autonomous Driving 3D City Simulator · OpenCV · FastAPI · Three.js</text>
</svg>
